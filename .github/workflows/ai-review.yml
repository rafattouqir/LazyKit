name: AI Peer Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.lock"
      - "**.png"

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" -- . \
            ':(exclude)*.png' ':(exclude)package-lock.json' > pr.diff || true
          head -c 400000 pr.diff > pr_truncated.diff
          mv pr_truncated.diff pr.diff
          wc -c pr.diff

      - name: AI review with CommandCode (skill-grounded)
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          COMMANDCODE_MODEL: deepseek/deepseek-v4.1-flash
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ai_review.py \
            --diff pr.diff \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --output review.md \
            --post
          echo "---- review preview ----"
          head -c 2000 review.md
