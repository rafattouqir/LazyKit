name: AI Peer Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.lock"
      - "**.png"

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Skip fork PRs. GitHub withholds secrets from fork-triggered workflows, so
    # there is no API key to review with, and the token is read-only so the
    # review could not be posted even if there were. Running anyway would execute
    # the PR author's copy of this script on our runner and burn minutes for a
    # job that cannot succeed. `pull_request` (not `pull_request_target`) is
    # deliberate: _target always runs and does expose secrets to untrusted code.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" -- . \
            ':(exclude)*.png' ':(exclude)package-lock.json' > pr.diff || true
          head -c 400000 pr.diff > pr_truncated.diff
          mv pr_truncated.diff pr.diff
          wc -c pr.diff

      - name: AI review with CommandCode (skill-grounded)
        # The reviewer is a standalone Swift script, not a package target: this
        # manifest is iOS/macOS-only and LazyKit imports SwiftUI, so `swift build`
        # cannot run on this Linux runner. `swift <file>` works because Swift is
        # preinstalled on ubuntu-latest.
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          COMMANDCODE_MODEL: deepseek/deepseek-v4.1-flash
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swift .github/scripts/ai_review.swift \
            --diff pr.diff \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --output review.md \
            --post
          echo "---- review preview ----"
          head -c 2000 review.md
